<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Background with padding for maskable safe zone -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Inner Safe Zone Content (within 80% circle) -->
  <g filter="url(#shadow)">
    <!-- Fork & Knife crossed / Restaurant emblem -->
    <path d="M190 120 C190 155 178 185 158 205 L158 350 C158 362 168 372 180 372 C192 372 202 362 202 350 L202 205 C182 185 170 155 170 120 Z" fill="#ffffff"/>
    <rect x="175" y="110" width="10" height="70" rx="5" fill="url(#bgGrad)"/>
    <rect x="155" y="110" width="8" height="60" rx="4" fill="url(#bgGrad)"/>
    <rect x="197" y="110" width="8" height="60" rx="4" fill="url(#bgGrad)"/>
    
    <!-- Knife -->
    <path d="M320 110 C345 125 355 160 355 210 L355 240 L330 240 L330 350 C330 362 320 372 308 372 C296 372 286 362 286 350 L286 110 Z" fill="#ffffff"/>
  </g>

  <!-- POS Terminal Screen / Signal Wave Badge -->
  <g transform="translate(196, 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="120" height="150" rx="18" fill="#1e293b" stroke="#ffffff" stroke-width="6"/>
    <rect x="15" y="16" width="90" height="60" rx="8" fill="#38bdf8"/>
    <!-- Screen checkmark & items -->
    <path d="M40 46 L52 58 L80 30" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Keypad dots -->
    <circle cx="36" cy="100" r="7" fill="#94a3b8"/>
    <circle cx="60" cy="100" r="7" fill="#94a3b8"/>
    <circle cx="84" cy="100" r="7" fill="#94a3b8"/>
    <circle cx="36" cy="122" r="7" fill="#94a3b8"/>
    <circle cx="60" cy="122" r="7" fill="#22c55e"/>
    <circle cx="84" cy="122" r="7" fill="#ea580c"/>
  </g>

  <!-- Star / Sparkle accents in safe zone -->
  <path d="M380 90 L385 105 L400 110 L385 115 L380 130 L375 115 L360 110 L375 105 Z" fill="#fef08a"/>
  <path d="M120 240 L124 252 L136 256 L124 260 L120 272 L116 260 L104 256 L116 252 Z" fill="#fef08a"/>
</svg>
